<style>
  /* Untitled UI–style tokens */
  :root{
    --bg:#FFFFFF; --bg-subtle:#F9FAFB; --bg-muted:#F2F4F7;
    --text:#101828; --text-2:#344054; --text-3:#475467; --text-4:#667085;
    --border:#EAECF0; --border-2:#D0D5DD;
    --brand-25:#FCFAFF; --brand-50:#F9F5FF; --brand-100:#F4EBFF; --brand-200:#E9D7FE; --brand-300:#D6BBFB;
    --brand-500:#9E77ED; --brand-600:#7F56D9; --brand-700:#6941C6;
    --shadow-xs:0 1px 2px rgba(16,24,40,.05);
    --shadow-sm:0 1px 3px rgba(16,24,40,.1),0 1px 2px rgba(16,24,40,.06);
    --ring:0 0 0 4px rgba(158,119,237,.24);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg-subtle);color:var(--text);
    font-family:'Inter','Sukhumvit Set','Leelawadee UI','Noto Sans Thai','Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden;}
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 48px;position:relative;}

  header{text-align:center;padding:16px 4px 20px;}
  .eyebrow{display:inline-block;font-size:12px;font-weight:500;color:var(--brand-700);background:var(--brand-50);
    border:1px solid var(--brand-200);border-radius:16px;padding:2px 10px;line-height:18px;}
  h1{font-size:30px;line-height:38px;margin:12px 0 4px;font-weight:600;letter-spacing:-.02em;color:var(--text);}
  .meta{font-size:14px;color:var(--text-3);line-height:20px;}
  .latest{margin:16px auto 0;display:inline-block;min-width:160px;padding:12px 24px;background:var(--bg);border:1px solid var(--border);
    border-radius:12px;box-shadow:var(--shadow-xs);font-size:36px;font-weight:600;letter-spacing:.04em;color:var(--brand-600);line-height:44px;}
  .latest:empty{display:none;}
  .latest .date{display:block;font-size:12px;font-weight:500;color:var(--text-4);letter-spacing:0;line-height:18px;}

  .chips{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 16px;}
  .chip{flex:1;min-width:150px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 16px;cursor:pointer;box-shadow:var(--shadow-xs);}
  .chip b{display:block;font-size:12px;font-weight:500;color:var(--text-4);margin-bottom:6px;line-height:18px;}
  .chip:focus-visible{outline:none;box-shadow:var(--ring);border-color:var(--brand-300);}
  .chip .nums{font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em;font-size:14px;line-height:20px;color:var(--text-2);}
  .chip.hot .nums{color:var(--brand-700);} .chip.cold .nums{color:var(--text-3);}
  .chip .more{display:block;font-size:12px;font-weight:500;color:var(--brand-600);margin-top:6px;}

  .rangetabs,.sorttabs{display:flex;background:var(--bg-muted);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px;}
  .rangetabs{margin-bottom:12px;}
  .controls{display:flex;gap:12px;margin:0 0 20px;align-items:stretch;}
  #search{flex:1;min-width:0;padding:10px 14px;border:1px solid var(--border-2);border-radius:8px;box-shadow:var(--shadow-xs);
    background:var(--bg);color:var(--text);font-size:16px;line-height:24px;font-family:inherit;font-weight:500;font-variant-numeric:tabular-nums;}
  #search::placeholder{color:var(--text-4);font-weight:400;}
  #search:focus{outline:none;border-color:var(--brand-300);box-shadow:var(--ring);}
  .tab{flex:1;border:none;background:transparent;color:var(--text-4);font-family:inherit;font-size:14px;line-height:20px;
    font-weight:600;padding:8px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;}
  .tab:hover{color:var(--text-2);}
  .tab:focus-visible{outline:none;box-shadow:var(--ring);}
  .tab.active{background:var(--bg);color:var(--text-2);box-shadow:var(--shadow-sm);}

  .tier-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--text-4);margin:20px 4px 6px;}
  .tier-label::after{content:"";flex:1;height:1px;background:var(--border);}
  .tier-label:first-of-type{margin-top:0;}

  .row{display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:8px;scroll-margin:70px;cursor:pointer;}
  .row:hover{background:var(--bg-muted);}
  .row.hit{background:var(--brand-50);}
  .row:focus-visible{outline:none;box-shadow:var(--ring);}
  .num{width:32px;flex:0 0 auto;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;color:var(--text-2);}
  .track{flex:1;height:8px;background:var(--bg-muted);border-radius:4px;overflow:hidden;}
  .row.hit .track{background:var(--brand-100);}
  .fill{height:100%;background:var(--brand-300);border-radius:4px;}
  .row.gold .fill{background:var(--brand-600);}
  .row.zero .num{opacity:.5;}
  .cnt{width:20px;flex:0 0 auto;font-size:12px;font-weight:500;color:var(--text-4);font-variant-numeric:tabular-nums;}
  .detail{display:none;font-size:12px;color:var(--text-3);background:var(--bg);border:1px solid var(--border);border-radius:8px;
    padding:0;margin:0 2px;line-height:1.7;}
  .detail.open{display:block;padding:10px 12px;margin:2px 2px 8px;box-shadow:var(--shadow-xs);}

  footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--text-4);text-align:center;line-height:18px;}
  .site-link{margin-top:12px;}
  .site-link a{color:var(--brand-600);font-weight:600;text-decoration:none;}
  .site-link a:hover{color:var(--brand-700);}
  .stale-note{display:none;font-size:12px;font-weight:500;color:#B42318;background:#FEF3F2;border:1px solid #FECDCA;border-radius:16px;padding:2px 10px;margin-top:8px;}
  .stale-note.show{display:inline-block;}

  @media (min-width: 720px) {
    .wrap{max-width:900px;}
    #list{display:grid;grid-template-columns:1fr 1fr;column-gap:32px;}
    .tier-label{grid-column:1/-1;}
    .detail.open{grid-column:1/-1;}
  }
  @media (min-width: 1080px) {
    .wrap{max-width:1180px;}
    #list{grid-template-columns:1fr 1fr 1fr;}
  }
  @media (prefers-reduced-motion: reduce){ * { scroll-behavior:auto !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">สลากกินแบ่งรัฐบาล · 2 Digits</div>
    <h1>2 Digits</h1>
    <div class="meta" id="meta">กำลังโหลด…</div>
    <div class="latest" id="latest"></div>
    <div class="stale-note" id="staleNote">โหลดข้อมูลไม่ได้ · เชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่</div>
  </header>

  <div class="chips">
    <div class="chip hot" id="hotChip" role="button" tabindex="0" aria-expanded="false"><b id="hotLabel">ออกบ่อยสุด</b><span class="nums" id="hotNums">…</span></div>
    <div class="chip cold" id="coldChip" role="button" tabindex="0" aria-expanded="false"><b>ไม่เคยออกเลย</b><span class="nums" id="coldNums">…</span></div>
  </div>

  <div class="rangetabs" role="tablist">
    <button class="tab active" data-range="5">5 ปี</button>
    <button class="tab" data-range="10">10 ปี</button>
    <button class="tab" data-range="20">20 ปี</button>
  </div>

  <div class="controls">
    <input type="search" id="search" placeholder="ค้นเลข เช่น 14" inputmode="numeric" maxlength="2" autocomplete="off">
    <div class="sorttabs" role="tablist">
      <button class="tab active" data-sort="freq">ความถี่</button>
      <button class="tab" data-sort="num">เลข</button>
    </div>
  </div>

  <div id="list"></div>

  <footer>แตะที่เลขเพื่อดูวันที่ออกแต่ละครั้ง · ที่มา: <span id="sourceName">-</span> · ตรวจสอบล่าสุด: <span id="lastChecked">-</span><div class="site-link"><a href="https://ssupawat.github.io/">← art.</a></div></footer>

</div>

<script>
const FALLBACK = {draws: []};

const thMonths = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function formatThaiDate(iso) {
  const [y,m,d] = iso.split('-').map(Number);
  return d + ' ' + thMonths[m-1] + ' ' + (y+543);
}

function formatThaiTimestamp(ms) {
  const d = new Date(ms);
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  return d.getDate() + ' ' + thMonths[d.getMonth()] + ' ' + (d.getFullYear()+543) + ' ' + h + ':' + m;
}

let allDraws = [];
let currentRangeYears = 5;
let currentSort = 'freq';
let openDetailEl = null;
const list = document.getElementById('list');

function localISODate(date) {
  const year = String(date.getFullYear()).padStart(4, '0');
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return year + '-' + month + '-' + day;
}

function filteredDraws() {
  const cutoff = new Date();
  cutoff.setFullYear(cutoff.getFullYear() - currentRangeYears);
  const cutoffISO = localISODate(cutoff);
  return allDraws.filter(([d]) => d >= cutoffISO).sort((a,b) => a[0] < b[0] ? -1 : 1);
}

function toggleDetail(num, dates) {
  const el = document.getElementById('detail-' + num);
  const row = el.previousElementSibling;
  if (openDetailEl && openDetailEl !== el) {
    openDetailEl.classList.remove('open');
    openDetailEl.textContent = '';
    const previousRow = openDetailEl.previousElementSibling;
    if (previousRow) previousRow.setAttribute('aria-expanded', 'false');
  }
  if (el.classList.contains('open')) {
    el.classList.remove('open');
    el.textContent = '';
    row.setAttribute('aria-expanded', 'false');
    openDetailEl = null;
  } else {
    el.textContent = dates.length ? dates.slice().reverse().map(formatThaiDate).join(' · ') : 'ไม่เคยออกในช่วงที่เลือก';
    el.classList.add('open');
    row.setAttribute('aria-expanded', 'true');
    openDetailEl = el;
  }
}

const CHIP_PREVIEW = 6;
const chipData = { hotNums: [], coldNums: [] };
const chipExpanded = { hotNums: false, coldNums: false };

function renderChip(elId, list, emptyText) {
  chipData[elId] = list;
  const el = document.getElementById(elId);
  if (!list.length) { el.textContent = emptyText; return; }
  const expanded = chipExpanded[elId];
  const shown = expanded ? list : list.slice(0, CHIP_PREVIEW);
  const remaining = list.length - shown.length;
  let html = shown.join(' · ');
  if (remaining > 0) html += '<span class="more">+' + remaining + ' แตะดูทั้งหมด</span>';
  else if (expanded && list.length > CHIP_PREVIEW) html += '<span class="more">แตะเพื่อย่อ</span>';
  el.innerHTML = html;
}

['hotChip', 'coldChip'].forEach((chipId) => {
  const chip = document.getElementById(chipId);
  const toggleChip = () => {
    const numsId = chipId === 'hotChip' ? 'hotNums' : 'coldNums';
    chipExpanded[numsId] = !chipExpanded[numsId];
    chip.setAttribute('aria-expanded', String(chipExpanded[numsId]));
    renderChip(numsId, chipData[numsId], numsId === 'hotNums' ? '—' : 'ไม่มี (ออกครบทุกเลขแล้ว)');
  };
  chip.addEventListener('click', toggleChip);
  chip.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      toggleChip();
    }
  });
});

function render() {
  const latestEl = document.getElementById('latest');
  if (allDraws.length) {
    const last = allDraws[allDraws.length-1];
    latestEl.innerHTML = last[1] + '<span class="date">ล่าสุด ' + formatThaiDate(last[0]) + '</span>';
  } else {
    latestEl.innerHTML = '';
  }

  if (!allDraws.length) {
    document.getElementById('meta').textContent = 'ไม่มีข้อมูลพร้อมใช้งาน';
    document.getElementById('hotLabel').textContent = 'ออกบ่อยสุด';
    renderChip('hotNums', [], 'ไม่มีข้อมูล');
    renderChip('coldNums', [], 'ไม่มีข้อมูล');
    list.textContent = 'เชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่';
    openDetailEl = null;
    return;
  }

  const filtered = filteredDraws();
  const byNum = {};
  for (let i = 0; i < 100; i++) byNum[String(i).padStart(2,'0')] = [];
  filtered.forEach(([d,v]) => { if (byNum[v]) byNum[v].push(d); });
  const entries = Object.entries(byNum).map(([num, dates]) => [num, dates.length, dates]);
  const maxCount = entries.reduce((m,[,c]) => Math.max(m,c), 0);

  document.getElementById('meta').textContent = filtered.length
    ? formatThaiDate(filtered[0][0]) + ' – ' + formatThaiDate(filtered[filtered.length-1][0]) + ' · รวม ' + filtered.length + ' งวด'
    : 'ไม่มีข้อมูลในช่วงที่เลือก';

  const hot = entries.filter(([,c]) => c === maxCount && c > 0).map(([n]) => n);
  const cold = entries.filter(([,c]) => c === 0).map(([n]) => n);
  document.getElementById('hotLabel').textContent = 'ออกบ่อยสุด · ' + maxCount + ' ครั้ง';
  renderChip('hotNums', hot, '—');
  renderChip('coldNums', cold, 'ไม่มี (ออกครบทุกเลขแล้ว)');

  const sorted = currentSort === 'num'
    ? entries.slice().sort((a,b) => a[0].localeCompare(b[0]))
    : entries.slice().sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0]));

  const frag = document.createDocumentFragment();
  let lastCount = null;
  openDetailEl = null;
  sorted.forEach(([num, count, dates]) => {
    if (currentSort === 'freq' && count !== lastCount) {
      const lbl = document.createElement('div');
      lbl.className = 'tier-label';
      lbl.textContent = count + ' ครั้ง' + (count === maxCount && count > 0 ? ' — ออกบ่อยสุด' : '') + (count === 0 ? ' — ไม่เคยออกเลย' : '');
      frag.appendChild(lbl);
      lastCount = count;
    }
    const row = document.createElement('div');
    row.className = 'row' + (count === maxCount && maxCount > 0 ? ' gold' : '') + (count === 0 ? ' zero' : '');
    row.dataset.num = num;
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');
    row.setAttribute('aria-expanded', 'false');
    row.setAttribute('aria-controls', 'detail-' + num);
    const pct = maxCount > 0 ? (count / maxCount * 100).toFixed(1) : 0;
    row.innerHTML = '<span class="num">' + num + '</span><div class="track"><div class="fill" style="width:' + pct + '%"></div></div><span class="cnt">' + count + '</span>';
    row.addEventListener('click', () => toggleDetail(num, dates));
    row.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggleDetail(num, dates);
      }
    });
    frag.appendChild(row);
    const det = document.createElement('div');
    det.className = 'detail';
    det.id = 'detail-' + num;
    frag.appendChild(det);
  });
  list.innerHTML = '';
  list.appendChild(frag);
}

async function loadData() {
  let payload;
  try {
    const res = await fetch('./draws.json');
    if (!res.ok) throw new Error('http ' + res.status);
    payload = await res.json();
    if (!Array.isArray(payload.draws) || payload.draws.length === 0) throw new Error('bad shape');
  } catch (e) {
    document.getElementById('staleNote').classList.add('show');
    payload = FALLBACK;
  }
  allDraws = payload.draws;
  document.getElementById('sourceName').textContent = payload.source || '-';
  document.getElementById('lastChecked').textContent = payload.lastChecked ? formatThaiTimestamp(payload.lastChecked) : '-';
  render();
}

document.querySelectorAll('.rangetabs .tab').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.rangetabs .tab').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    currentRangeYears = Number(btn.dataset.range);
    render();
  });
});
document.querySelectorAll('.sorttabs .tab').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sorttabs .tab').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    currentSort = btn.dataset.sort;
    render();
  });
});

function tryJump(raw) {
  const digits = raw.replace(/\D/g, '');
  if (digits.length === 0) return;
  const v = digits.length === 1 ? '0' + digits : digits.slice(0, 2);
  const el = list.querySelector('.row[data-num="' + v + '"]');
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('hit');
    setTimeout(() => el.classList.remove('hit'), 1200);
  }
}
const searchEl = document.getElementById('search');
searchEl.addEventListener('input', (e) => { if (e.target.value.replace(/\D/g,'').length === 2) tryJump(e.target.value); });
searchEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryJump(e.target.value); });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}

loadData();
</script>
</body>
</html>
