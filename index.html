<style>
  /* Colour and shadow values */
  :root{
    --background:#FFFFFF; --background-light:#F9FAFB; --background-soft:#F2F4F7;
    --text:#101828; --text-2:#344054; --text-3:#475467; --text-4:#667085;
    --border:#EAECF0; --border-2:#D0D5DD;
    --main-25:#FCFAFF; --main-50:#F9F5FF; --main-100:#F4EBFF; --main-200:#E9D7FE; --main-300:#D6BBFB;
    --main-500:#9E77ED; --main-600:#7F56D9; --main-700:#6941C6;
    --shadow-small:0 1px 2px rgba(16,24,40,.05);
    --shadow-medium:0 1px 3px rgba(16,24,40,.1),0 1px 2px rgba(16,24,40,.06);
    --focus-line:0 0 0 4px rgba(158,119,237,.24);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--background-light);color:var(--text);
    font-family:'Inter','Sukhumvit Set','Leelawadee UI','Noto Sans Thai','Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden;}
  .page{max-width:640px;margin:0 auto;padding:24px 16px 48px;position:relative;}

  header{text-align:center;padding:16px 4px 20px;}
  h1{font-size:26px;line-height:34px;margin:0 0 4px;font-weight:600;letter-spacing:-.02em;color:var(--text);}
  .info{font-size:14px;color:var(--text-3);line-height:20px;}
  .latest{margin:16px auto 0;display:inline-block;min-width:160px;padding:12px 24px;background:var(--background);border:1px solid var(--border);
    border-radius:12px;box-shadow:var(--shadow-small);font-size:28px;font-weight:600;letter-spacing:.04em;color:var(--text-2);line-height:36px;}
  .latest:empty{display:none;}
  .latest .label{display:block;font-size:12px;font-weight:500;color:var(--text-4);letter-spacing:0;line-height:18px;}

  .chips{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 16px;}
  .chip{flex:1;min-width:150px;background:var(--background);border:1px solid var(--border);border-radius:12px;padding:12px 16px;cursor:pointer;box-shadow:var(--shadow-small);}
  .chip b{display:block;font-size:12px;font-weight:500;color:var(--text-4);margin-bottom:6px;line-height:18px;}
  .chip:focus-visible{outline:none;box-shadow:var(--focus-line);border-color:var(--main-300);}
  .chip .numbers{font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em;font-size:14px;line-height:20px;color:var(--text-2);}
  .chip.hot .numbers{color:var(--main-700);} .chip.cold .numbers{color:var(--text-3);}
  .item{white-space:nowrap;}
  .items .item:not(:last-child)::after{content:' ·';}
  .chip .more{display:block;font-size:12px;font-weight:500;color:var(--main-600);margin-top:6px;}

  .rangetabs,.sorttabs{display:flex;background:var(--background-soft);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px;}
  .rangetabs{margin-bottom:12px;}
  .controls{display:flex;gap:12px;margin:0 0 20px;align-items:stretch;}
  #search{flex:1;min-width:0;padding:10px 14px;border:1px solid var(--border-2);border-radius:8px;box-shadow:var(--shadow-small);
    background:var(--background);color:var(--text);font-size:16px;line-height:24px;font-family:inherit;font-weight:500;font-variant-numeric:tabular-nums;}
  #search::placeholder{color:var(--text-4);font-weight:400;}
  #search:focus{outline:none;border-color:var(--main-300);box-shadow:var(--focus-line);}
  .tab{flex:1;border:none;background:transparent;color:var(--text-4);font-family:inherit;font-size:14px;line-height:20px;
    font-weight:600;padding:12px;border-radius:6px;cursor:pointer;white-space:nowrap;}
  .tab:hover{color:var(--text-2);}
  .tab:focus-visible{outline:none;box-shadow:var(--focus-line);}
  .tab.active{background:var(--background);color:var(--text-2);box-shadow:var(--shadow-medium);}

  .counts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px;}
  .counts .chip{min-width:0;}
  .counts .chip .numbers{font-size:13px;word-break:break-word;}

  .grid-card{background:var(--background);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-small);padding:16px;}
  #grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;}
  .cell{position:relative;aspect-ratio:1;min-width:0;border:1px solid transparent;border-radius:6px;padding:0;cursor:pointer;
    font-family:inherit;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-2);
    background:var(--background-soft);display:flex;align-items:center;justify-content:center;}
  .cell[data-level="0"]{background:var(--background);border:1px dashed var(--border-2);color:var(--text-4);font-weight:500;}
  .cell[data-level="1"]{background:var(--main-100);color:var(--main-700);}
  .cell[data-level="2"]{background:var(--main-200);color:var(--main-700);}
  .cell[data-level="3"]{background:var(--main-500);color:#fff;}
  .cell[data-level="4"]{background:var(--main-600);color:#fff;}
  .cell:hover{transform:scale(1.08);z-index:1;box-shadow:var(--shadow-medium);}
  .cell:focus-visible{outline:none;box-shadow:var(--focus-line);z-index:1;}
  .cell.chosen{outline:2px solid var(--text);outline-offset:1px;z-index:1;}
  .cell.found{outline:2px solid var(--main-600);outline-offset:2px;z-index:1;}
  .legend{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:12px;font-size:12px;color:var(--text-4);}
  .legend i{width:14px;height:14px;border-radius:4px;display:inline-block;}
  .legend .level-0{background:var(--background);border:1px dashed var(--border-2);}
  .legend .level-1{background:var(--main-100);} .legend .level-2{background:var(--main-200);}
  .legend .level-3{background:var(--main-500);} .legend .level-4{background:var(--main-600);}
  .grid-detail{scroll-margin-bottom:16px;margin-top:12px;padding:12px;border-radius:8px;background:var(--main-25);border:1px solid var(--main-100);font-size:13px;color:var(--text-3);line-height:1.7;}
  .grid-detail b{color:var(--text);font-size:16px;margin-right:6px;}
  .recent{display:none;}
  [hidden]{display:none !important;}
  @media (min-width:720px){#grid{gap:6px;} .cell{font-size:14px;}}

  .tier-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--text-4);margin:20px 4px 6px;}
  .tier-label::after{content:"";flex:1;height:1px;background:var(--border);}
  .tier-label:first-of-type{margin-top:0;}

  .row{display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:8px;scroll-margin:70px;cursor:pointer;}
  .row:hover{background:var(--background-soft);}
  .row.found{background:var(--main-50);}
  .row:focus-visible{outline:none;box-shadow:var(--focus-line);}
  .number{width:32px;flex:0 0 auto;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;color:var(--text-2);}
  .track{flex:1;height:8px;background:var(--background-soft);border-radius:4px;overflow:hidden;}
  .row.found .track{background:var(--main-100);}
  .fill{height:100%;background:var(--main-300);border-radius:4px;}
  .row.gold .fill{background:var(--main-600);}
  .row.zero .number{opacity:.5;}
  .count{width:20px;flex:0 0 auto;font-size:12px;font-weight:500;color:var(--text-4);font-variant-numeric:tabular-nums;}
  .detail{display:none;font-size:12px;color:var(--text-3);background:var(--background);border:1px solid var(--border);border-radius:8px;
    padding:0;margin:0 2px;line-height:1.7;}
  .detail.open{display:block;padding:10px 12px;margin:2px 2px 8px;box-shadow:var(--shadow-small);}

  footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--text-4);text-align:center;line-height:18px;}
  .home-link{margin-top:12px;}
  .home-link a{color:var(--main-600);font-weight:600;text-decoration:none;}
  .home-link a:hover{color:var(--main-700);}
  .stale-note{display:none;font-size:12px;font-weight:500;color:#B42318;background:#FEF3F2;border:1px solid #FECDCA;border-radius:16px;padding:2px 10px;margin-top:8px;}
  .stale-note.show{display:inline-block;}

  @media (min-width: 720px) {
    .page{max-width:720px;}
    #list{display:grid;grid-template-columns:1fr 1fr;column-gap:32px;}
    .tier-label{grid-column:1/-1;}
    .detail.open{grid-column:1/-1;}
  }
  /* Desktop: controls on the left (sticky), results on the right */
  @media (min-width: 960px) {
    /* desktop = one full-screen view, no page scroll */
    .page{max-width:1120px;height:100vh;min-height:560px;padding:36px 32px 0;display:flex;flex-direction:column;}
    .parts{flex:1;min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:40px;}
    .main{min-height:0;overflow-y:auto;padding:2px;margin:-2px;}
    footer{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:4px 16px;margin-top:12px;padding:12px 0;}
    .home-link{margin:0;}
    .side{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start;min-height:0;overflow-y:auto;padding:2px;margin:-2px;}
    header{display:contents;}
    h1{grid-column:1/-1;font-size:26px;line-height:34px;text-wrap:balance;text-align:left;margin:0;}
    .info{grid-column:1/-1;text-align:left;margin:-8px 0 4px;}
    .stale-note{grid-column:1/-1;justify-self:start;margin:0;}
    .latest{display:none;}
    .counts{display:contents;}
    .counts .chip{margin:0;}
    #hotChip,#coldChip,.rangetabs,.controls,.grid-detail{grid-column:1/-1;}
    /* order: title → controls → stats → latest draws → tapped-number detail */
    .rangetabs{order:1;} .controls{order:2;} #hotChip{order:3;} #coldChip{order:4;} .recent{order:5;} .grid-detail{order:6;}
    .sorttabs{order:-1;}
    .counts .chip .numbers{font-size:14px;}
    .rangetabs{margin:0;}
    .controls{flex-direction:column;margin:0;}
    .sorttabs .tab,.rangetabs .tab{padding:10px;}
    .grid-detail{margin:0;height:100px;overflow-y:auto;padding:14px 16px;background:var(--background);border:1px solid var(--border);box-shadow:var(--shadow-small);}
    .recent{display:block;grid-column:1/-1;background:var(--background);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-small);padding:10px 12px;}
    .recent h2{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--text-4);line-height:18px;}
    .recent .recent-list{display:flex;gap:6px;}
    .recent .result{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:8px;background:var(--background-light);}
    .recent .result b{font-size:17px;line-height:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--text-2);}
    .recent .result.new{background:var(--main-50);box-shadow:inset 0 0 0 1px var(--main-200);}
    .recent .result.new b{color:var(--main-700);}
    .recent .result span{font-size:11px;line-height:16px;color:var(--text-4);white-space:nowrap;}
    .grid-detail.empty{border-style:dashed;box-shadow:none;background:transparent;color:var(--text-4);}
    .grid-card{padding:24px;}
    /* keep the whole 10×10 map inside the viewport height */
    #grid{gap:8px;max-width:max(360px,calc(100vh - 206px));margin:0 auto;}
    .legend{max-width:max(360px,calc(100vh - 206px));margin-left:auto;margin-right:auto;}
    .cell{font-size:15px;border-radius:8px;}
    .legend{margin-top:16px;}
    #list{background:var(--background);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-small);padding:16px 20px;column-gap:40px;}
  }
  /* short desktop windows: tighten the sidebar so everything still fits */
  @media (min-width: 960px) and (max-height: 760px) {
    .page{padding-top:24px;}
    .side{gap:8px;}
    .info{margin-top:-4px;}
    .counts .chip{padding:8px 12px;}
    .sorttabs .tab,.rangetabs .tab{padding:7px;}
    #search{padding:7px 14px;}
    .grid-detail{height:90px;padding:10px 14px;}
    .recent{padding:8px 12px;}
    .recent .result{padding:3px 0;}
  }
  @media (prefers-reduced-motion: reduce){ * { scroll-behavior:auto !important; } }
</style>

<body>
<div class="page">
<div class="parts">
<div class="side">

  <header>
    <h1>เลขท้าย 2 ตัว ออกอะไรบ่อย?</h1>
    <div class="info" id="info">กำลังโหลด…</div>
    <div class="latest" id="latest"></div>
    <div class="stale-note" id="staleNote">โหลดข้อมูลไม่ได้ · เชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่</div>
  </header>

  <div class="counts">
    <div class="chip hot" id="hotChip" role="button" tabindex="0" aria-expanded="false"><b id="hotLabel">ออกบ่อยสุด</b><span class="numbers" id="hotNumbers">…</span></div>
    <div class="chip cold" id="coldChip" role="button" tabindex="0" aria-expanded="false"><b>ไม่เคยออกเลย</b><span class="numbers" id="coldNumbers">…</span></div>
  </div>

  <div class="rangetabs" role="tablist">
    <button class="tab active" data-range="5">5 ปี</button>
    <button class="tab" data-range="10">10 ปี</button>
    <button class="tab" data-range="20">20 ปี</button>
  </div>

  <div class="controls">
    <input type="search" id="search" placeholder="ค้นเลข เช่น 14" inputmode="numeric" maxlength="2" autocomplete="off">
    <div class="sorttabs" role="tablist">
      <button class="tab active" data-sort="map">แผนผัง</button>
      <button class="tab" data-sort="often">ความถี่</button>
      <button class="tab" data-sort="number">เลข</button>
    </div>
  </div>

  <div class="recent" id="recent" hidden></div>

</div>
<main class="main">

  <div class="grid-card" id="gridCard">
    <div id="grid" role="grid" aria-label="ความถี่เลขท้าย 2 ตัว 00–99"></div>
    <div class="legend"><span id="legendMin">0 ครั้ง</span><i class="level-0"></i><i class="level-1"></i><i class="level-2"></i><i class="level-3"></i><i class="level-4"></i><span id="legendMax">–</span></div>
    <div class="grid-detail" id="gridDetail" hidden></div>
  </div>

  <div id="list" hidden></div>

</main>
</div>

  <footer><span>แตะที่เลขเพื่อดูวันที่ออกแต่ละครั้ง · ที่มา: <span id="sourceName">-</span> · ตรวจสอบล่าสุด: <span id="lastChecked">-</span><span id="visitsBox" hidden> · เข้าชมสะสม: <span id="visits"></span> ครั้ง</span></span><div class="home-link"><a href="https://ssupawat.github.io/">← art.</a></div></footer>

</div>

<script>
const EMPTY_DATA = {draws: []};

const thaiMonths = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function formatThaiDate(text) {
  const [year, month, day] = text.split('-').map(Number);
  return day + ' ' + thaiMonths[month-1] + ' ' + (year+543);
}

function formatThaiCheckedDate(time) {
  const date = new Date(time);
  return date.getDate() + ' ' + thaiMonths[date.getMonth()] + ' ' + (date.getFullYear()+543);
}

let allDraws = [];
let currentYears = 5;
let currentShow = 'map';
let chosenCell = null;
let openDetail = null;
const list = document.getElementById('list');
const gridEl = document.getElementById('grid');
const gridDetail = document.getElementById('gridDetail');

function localISODate(date) {
  const year = String(date.getFullYear()).padStart(4, '0');
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return year + '-' + month + '-' + day;
}

function chosenDraws() {
  const cutoff = new Date();
  cutoff.setFullYear(cutoff.getFullYear() - currentYears);
  const cutoffISO = localISODate(cutoff);
  return allDraws.filter(([date]) => date >= cutoffISO).sort((first, second) => first[0] < second[0] ? -1 : 1);
}

function toggleDetail(number, dates) {
  const element = document.getElementById('detail-' + number);
  const row = element.previousElementSibling;
  if (openDetail && openDetail !== element) {
    openDetail.classList.remove('open');
    openDetail.textContent = '';
    const earlierRow = openDetail.previousElementSibling;
    if (earlierRow) earlierRow.setAttribute('aria-expanded', 'false');
  }
  if (element.classList.contains('open')) {
    element.classList.remove('open');
    element.textContent = '';
    row.setAttribute('aria-expanded', 'false');
    openDetail = null;
  } else {
    element.textContent = dates.length ? dates.slice().reverse().map(formatThaiDate).join(' · ') : 'ไม่เคยออกในช่วงที่เลือก';
    element.classList.add('open');
    row.setAttribute('aria-expanded', 'true');
    openDetail = element;
  }
}

const bigScreen = window.matchMedia('(min-width: 960px)');
const chipPreview = () => bigScreen.matches ? 10 : 4;
const chipData = { hotNumbers: [], coldNumbers: [] };
const chipExpanded = { hotNumbers: false, coldNumbers: false };

function renderChip(elementId, numbers, emptyText) {
  chipData[elementId] = numbers;
  const element = document.getElementById(elementId);
  if (!numbers.length) { element.textContent = emptyText; return; }
  const isOpen = chipExpanded[elementId];
  const shown = isOpen ? numbers : numbers.slice(0, chipPreview());
  const rest = numbers.length - shown.length;
  let html = '<span class="items">' + shown.map((number) => '<span class="item">' + number + '</span>').join(' ') + '</span>';
  if (rest > 0) html += '<span class="more">+' + rest + ' แตะดูทั้งหมด</span>';
  else if (isOpen && numbers.length > chipPreview()) html += '<span class="more">แตะเพื่อย่อ</span>';
  element.innerHTML = html;
}

['hotChip', 'coldChip'].forEach((chipId) => {
  const chip = document.getElementById(chipId);
  const toggleChip = () => {
    const numbersId = chipId === 'hotChip' ? 'hotNumbers' : 'coldNumbers';
    chipExpanded[numbersId] = !chipExpanded[numbersId];
    chip.setAttribute('aria-expanded', String(chipExpanded[numbersId]));
    renderChip(numbersId, chipData[numbersId], numbersId === 'hotNumbers' ? '—' : 'ไม่มี (ออกครบทุกเลขแล้ว)');
  };
  chip.addEventListener('click', toggleChip);
  chip.addEventListener('keydown', (event) => {
    if (event.legend === 'Enter' || event.legend === ' ') {
      event.preventDefault();
      toggleChip();
    }
  });
});

function render() {
  const latestElement = document.getElementById('latest');
  if (allDraws.length) {
    const last = allDraws[allDraws.length-1];
    latestElement.innerHTML = '<span class="label">ผลที่ออกแล้ว · งวด ' + formatThaiDate(last[0]) + '</span>' + last[1];
  } else {
    latestElement.innerHTML = '';
  }

  if (!allDraws.length) {
    document.getElementById('info').textContent = 'ไม่มีข้อมูลพร้อมใช้งาน';
    document.getElementById('hotLabel').textContent = 'ออกบ่อยสุด';
    renderChip('hotNumbers', [], 'ไม่มีข้อมูล');
    renderChip('coldNumbers', [], 'ไม่มีข้อมูล');
    gridEl.textContent = '';
    document.getElementById('recent').hidden = true;
    gridDetail.hidden = true;
    document.getElementById('gridCard').hidden = true;
    list.hidden = false;
    list.textContent = 'เชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่';
    openDetail = null;
    return;
  }

  const recentElement = document.getElementById('recent');
  recentElement.innerHTML = '<h2>ผลล่าสุด 5 งวด</h2><div class="recent-list">' + allDraws.slice(-5).reverse().map(([date, value], index) =>
    '<div class="result' + (index === 0 ? ' new' : '') + '" title="' + formatThaiDate(date) + '"><b>' + value + '</b><span>' + formatThaiDate(date).replace(/ \d+$/, '') + '</span></div>').join('') + '</div>';
  recentElement.hidden = false;

  const chosen = chosenDraws();
  const byNumber = {};
  for (let index = 0; index < 100; index++) byNumber[String(index).padStart(2,'0')] = [];
  chosen.forEach(([date, value]) => { if (byNumber[value]) byNumber[value].push(date); });
  const items = Object.entries(byNumber).map(([number, dates]) => [number, dates.length, dates]);
  const largestCount = items.reduce((most, [, count]) => Math.max(most, count), 0);

  document.getElementById('info').textContent = chosen.length
    ? formatThaiDate(chosen[0][0]) + ' – ' + formatThaiDate(chosen[chosen.length-1][0]) + ' · รวม ' + chosen.length + ' งวด'
    : 'ไม่มีข้อมูลในช่วงที่เลือก';

  const hot = items.filter(([, count]) => count === largestCount && count > 0).map(([number]) => number);
  const cold = items.filter(([, count]) => count === 0).map(([number]) => number);
  document.getElementById('hotLabel').textContent = 'ออกบ่อยสุด · ' + largestCount + ' ครั้ง';
  renderChip('hotNumbers', hot, '—');
  renderChip('coldNumbers', cold, 'ไม่มี (ออกครบทุกเลขแล้ว)');

  const showMap = currentShow === 'map';
  document.getElementById('gridCard').hidden = !showMap;
  list.hidden = showMap;
  if (!showMap) { chosenCell = null; gridDetail.hidden = true; }
  if (showMap) {
    renderGrid(items.slice().sort((first, second) => first[0].localeCompare(second[0])), largestCount);
    list.innerHTML = '';
    openDetail = null;
    return;
  }

  const sorted = currentShow === 'number'
    ? items.slice().sort((first, second) => first[0].localeCompare(second[0]))
    : items.slice().sort((first, second) => second[1] - first[1] || first[0].localeCompare(second[0]));

  const frag = document.createDocumentFragment();
  let lastCount = null;
  openDetail = null;
  sorted.forEach(([number, count, dates]) => {
    if (currentShow === 'often' && count !== lastCount) {
      const label = document.createElement('div');
      label.className = 'tier-label';
      label.textContent = count + ' ครั้ง' + (count === largestCount && count > 0 ? ' — ออกบ่อยสุด' : '') + (count === 0 ? ' — ไม่เคยออกเลย' : '');
      frag.appendChild(label);
      lastCount = count;
    }
    const row = document.createElement('div');
    row.className = 'row' + (count === largestCount && largestCount > 0 ? ' gold' : '') + (count === 0 ? ' zero' : '');
    row.dataset.number = number;
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');
    row.setAttribute('aria-expanded', 'false');
    row.setAttribute('aria-controls', 'detail-' + number);
    const percent = largestCount > 0 ? (count / largestCount * 100).toFixed(1) : 0;
    row.innerHTML = '<span class="number">' + number + '</span><div class="track"><div class="fill" style="width:' + percent + '%"></div></div><span class="count">' + count + '</span>';
    row.addEventListener('click', () => toggleDetail(number, dates));
    row.addEventListener('keydown', (event) => {
      if (event.legend === 'Enter' || event.legend === ' ') {
        event.preventDefault();
        toggleDetail(number, dates);
      }
    });
    frag.appendChild(row);
    const detail = document.createElement('div');
    detail.className = 'detail';
    detail.id = 'detail-' + number;
    frag.appendChild(detail);
  });
  list.innerHTML = '';
  list.appendChild(frag);
}

function clearDetail() {
  if (bigScreen.matches && currentShow === 'map') {
    gridDetail.className = 'grid-detail empty';
    gridDetail.textContent = 'แตะเลขในแผนผังเพื่อดูวันที่ที่เคยออก';
    gridDetail.hidden = false;
  } else {
    gridDetail.className = 'grid-detail';
    gridDetail.hidden = true;
  }
}
function putDetail() {
  if (bigScreen.matches) document.querySelector('.side').insertBefore(gridDetail, document.getElementById('recent'));
  else document.getElementById('gridCard').appendChild(gridDetail);
  if (!chosenCell) clearDetail();
}
bigScreen.addEventListener('change', () => { putDetail(); renderChip('hotNumbers', chipData.hotNumbers, '—'); renderChip('coldNumbers', chipData.coldNumbers, 'ไม่มี (ออกครบทุกเลขแล้ว)'); });

function renderGrid(items, largestCount) {
  document.getElementById('legendMax').textContent = largestCount + ' ครั้ง';
  const frag = document.createDocumentFragment();
  chosenCell = null;
  clearDetail();
  items.forEach(([number, count, dates]) => {
    const level = count === 0 ? 0 : Math.max(1, Math.ceil(count / largestCount * 4));
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'cell';
    cell.dataset.number = number;
    cell.dataset.level = level;
    cell.textContent = number;
    cell.setAttribute('aria-label', number + ' ออก ' + count + ' ครั้ง');
    cell.addEventListener('click', () => {
      if (chosenCell === cell) {
        cell.classList.remove('chosen');
        chosenCell = null;
        clearDetail();
        return;
      }
      if (chosenCell) chosenCell.classList.remove('chosen');
      cell.classList.add('chosen');
      chosenCell = cell;
      gridDetail.className = 'grid-detail';
      gridDetail.innerHTML = '<b>' + number + '</b>ออก ' + count + ' ครั้ง' +
        (dates.length ? '<br>' + dates.slice().reverse().map(formatThaiDate).join(' · ') : ' ในช่วงที่เลือก');
      gridDetail.hidden = false;
      if (!bigScreen.matches) gridDetail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
    frag.appendChild(cell);
  });
  gridEl.innerHTML = '';
  gridEl.appendChild(frag);
}

async function loadData() {
  let payload;
  try {
    const res = await fetch('./draws.json');
    if (!res.ok) throw new Error('http ' + res.status);
    payload = await res.json();
    if (!Array.isArray(payload.draws) || payload.draws.length === 0) throw new Error('bad shape');
  } catch (problem) {
    document.getElementById('staleNote').classList.add('show');
    payload = EMPTY_DATA;
  }
  allDraws = payload.draws;
  document.getElementById('sourceName').textContent = payload.source || '-';
  document.getElementById('lastChecked').textContent = payload.lastChecked ? formatThaiCheckedDate(payload.lastChecked) : '-';
  render();
}

document.querySelectorAll('.rangetabs .tab').forEach((button) => {
  button.addEventListener('click', () => {
    document.querySelectorAll('.rangetabs .tab').forEach((other) => other.classList.remove('active'));
    button.classList.add('active');
    currentYears = Number(button.dataset.range);
    render();
  });
});
document.querySelectorAll('.sorttabs .tab').forEach((button) => {
  button.addEventListener('click', () => {
    document.querySelectorAll('.sorttabs .tab').forEach((other) => other.classList.remove('active'));
    button.classList.add('active');
    currentShow = button.dataset.sort;
    render();
  });
});

function tryMove(text) {
  const digits = text.replace(/\D/g, '');
  if (digits.length === 0) return;
  const value = digits.length === 1 ? '0' + digits : digits.slice(0, 2);
  const element = (currentShow === 'map' ? gridEl : list).querySelector('[data-number="' + value + '"]');
  if (element) {
    element.scrollIntoView({ behavior: 'smooth', block: 'center' });
    element.classList.add('found');
    setTimeout(() => element.classList.remove('found'), 1200);
  }
}
const searchElement = document.getElementById('search');
searchElement.addEventListener('input', (event) => { if (event.target.value.replace(/\D/g,'').length === 2) tryMove(event.target.value); });
searchElement.addEventListener('keydown', (event) => { if (event.legend === 'Enter') tryMove(event.target.value); });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}

// Total visits from GoatCounter's public counter. If it fails (no internet,
// blocked, counter off), the bottom line simply leaves it out.
async function loadVisits() {
  try {
    const res = await fetch('https://2digits.goatcounter.com/counter/TOTAL.json');
    if (!res.ok) return;
    const data = await res.json();
    const count = parseInt(String(data.count).replace(/\D/g, ''), 10);
    if (!Number.isFinite(count)) return;
    document.getElementById('visits').textContent = count.toLocaleString('en-US');
    document.getElementById('visitsBox').hidden = false;
  } catch (problem) {}
}

putDetail();
loadData();
loadVisits();
</script>
